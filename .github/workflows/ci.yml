name: Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest build -e ./backend
      - run: python tests/packaging/installed_core_runner.py
      - run: python -m pytest -q -m 'not web'

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'frontend/.nvmrc'
          cache: npm
          cache-dependency-path: 'frontend/package-lock.json'
      - run: python -m pip install --disable-pip-version-check pytest build
      - run: npm --prefix frontend ci --include=dev --no-audit --no-fund
      - run: npm --prefix frontend run build
      - run: python -m pip install --disable-pip-version-check -e ./backend -e ./packages/ui
      - run: npm --prefix frontend run check:runtime
      - run: npm --prefix frontend run test:coverage-map
      - run: npm --prefix frontend run test:chart-module
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run test:unit
      - run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - run: npm --prefix frontend run test:pseudo
      - run: npm --prefix frontend run test:browser
      - run: npm --prefix frontend run test:demo
      - run: npm --prefix frontend run test:installed
      - run: python -m pytest -q -m web
      - name: Validate demo UI build identity
        run: python ops/demo/test_verify_ui_build.py
      - name: Build and verify the database-backed demo image
        run: |
          docker build --file ops/demo/Dockerfile --build-arg SOURCE_SHA="$(git rev-parse HEAD)" --tag noautonomo-demo:ci .
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --mount "type=bind,source=$PWD/ops/demo/test_image.py,target=/test_image.py,readonly" noautonomo-demo:ci python /test_image.py
      - name: Validate operational shell scripts
        run: |
          find ops -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
